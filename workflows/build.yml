name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconsole --onefile auto_file_organizer_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: Windows-App
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS APP
        run: pyinstaller --windowed --onefile auto_file_organizer_gui.py

      - name: Upload macOS Build
        uses: actions/upload-artifact@v3
        with:
          name: macOS-App
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: pyinstaller --noconsole --onefile auto_file_organizer_gui.py

      - name: Upload Linux Build
        uses: actions/upload-artifact@v3
        with:
          name: Linux-App
          path: dist/*
