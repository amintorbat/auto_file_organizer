name: Build and Release Auto File Organizer

on:
  push:
    tags:
      - 'v*'

jobs:

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows EXE
        run: |
          pyinstaller --windowed --onefile --name AutoFileOrganizer auto_file_organizer_gui.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/AutoFileOrganizer.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App
        run: |
          pyinstaller --windowed --onefile --name AutoFileOrganizer auto_file_organizer_gui.py

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/AutoFileOrganizer*
          if-no-files-found: error
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxcb-render0 libxcb-render-util0

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux Binary
        run: |
          pyinstaller --windowed --onefile --name AutoFileOrganizer auto_file_organizer_gui.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/AutoFileOrganizer
          if-no-files-found: error
          retention-days: 7

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          echo "Artifact structure:"
          find artifacts -type f || true
          ls -R artifacts/ || true
          
          # Find and prepare files with proper names
          mkdir -p release-files
          
          # Windows
          if [ -f "artifacts/windows-build/AutoFileOrganizer.exe" ]; then
            cp artifacts/windows-build/AutoFileOrganizer.exe release-files/AutoFileOrganizer-Windows.exe
          else
            find artifacts/windows-build -type f -name "*.exe" -exec cp {} release-files/AutoFileOrganizer-Windows.exe \;
          fi
          
          # macOS
          if [ -f "artifacts/macos-build/AutoFileOrganizer" ]; then
            cp artifacts/macos-build/AutoFileOrganizer release-files/AutoFileOrganizer-macOS
          elif [ -d "artifacts/macos-build/AutoFileOrganizer.app" ]; then
            cp -r artifacts/macos-build/AutoFileOrganizer.app release-files/
          else
            find artifacts/macos-build -type f -executable -exec cp {} release-files/AutoFileOrganizer-macOS \;
          fi
          
          # Linux
          if [ -f "artifacts/linux-build/AutoFileOrganizer" ]; then
            cp artifacts/linux-build/AutoFileOrganizer release-files/AutoFileOrganizer-Linux
          else
            find artifacts/linux-build -type f -executable -exec cp {} release-files/AutoFileOrganizer-Linux \;
          fi
          
          echo "Release files prepared:"
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
