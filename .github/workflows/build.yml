name: Build and Release Auto File Organizer

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        run: pyinstaller --noconsole --onefile auto_file_organizer_gui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFileOrganizer-Windows
          path: dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS APP
        run: pyinstaller --windowed --onefile auto_file_organizer_gui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFileOrganizer-macOS
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: pyinstaller --noconsole --onefile auto_file_organizer_gui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoFileOrganizer-Linux
          path: dist/*

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/**/*
